name: Azure Stream Analytics
description: Azure Stream Analytics REST API provides management of real-time analytics jobs that process streaming data from
  IoT devices, Event Hubs, and blob storage. It supports creating streaming jobs, defining input sources, output destinations,
  and transformation queries using SQL-like syntax.
